[project]
name = "pptx_plus"
version = "0.1.0"
description = "OPC-level extensions for python-pptx: delete, move, and duplicate slides with correct relationship and part handling."
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Tom Villani, PhD", email = "thomas.villani@gmail.com" }]
keywords = [
    "pptx",
    "ooxml",
    "openxml",
    "powerpoint",
    "microsoft-powerpoint",
    "python-pptx",
    "slides",
    "slide-management",
    "delete-slide",
    "duplicate-slide",
    "reorder-slides",
    "opc",
    "presentation-automation",
    "deck-automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: XML",
    "Typing :: Typed",
]
dependencies = [
    # Upper-bounded because this library reaches below python-pptx's public
    # object model into the OPC layer. `core/_compat.py` asserts the exact
    # surface we depend on at import time; a major bump must be re-verified
    # against it, not assumed compatible. SPEC §14.
    "python-pptx>=1.0.2,<2",
    # A direct dependency even though python-pptx already requires lxml: we
    # import `lxml.etree` ourselves, and python-pptx's floor (>=3.1.0) is far
    # below what this code needs. Declaring it is also what makes the
    # min-deps CI job meaningful — it pins a floor we promise, not one
    # python-pptx happens to promise.
    "lxml>=4.9",
]

[project.urls]
Homepage = "https://github.com/thomas-villani/pptx-plus"
Documentation = "https://thomas-villani.github.io/pptx-plus/"
Repository = "https://github.com/thomas-villani/pptx-plus"
Issues = "https://github.com/thomas-villani/pptx-plus/issues"
Changelog = "https://github.com/thomas-villani/pptx-plus/blob/main/CHANGELOG.md"

# No [project.scripts] at v0.1 — see ROADMAP.md. A `pptx-plus` console
# script arrives with v0.2's cross-deck copy/merge, where a shell verb earns
# its argument parsing. The three v0.1 verbs mutate a deck in place and would
# need --output / backup semantics before they are safe to expose to a shell.

[project.optional-dependencies]
# Single source of truth for dev deps. `uv sync --extra dev` and
# `pip install -e ".[dev]"` both resolve to this list; the older
# `[tool.uv] dev-dependencies` table is deliberately not duplicated so
# the two can't drift.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "lxml-stubs>=0.5",
    "pre-commit>=3.5",
    "bump-my-version>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pptx_plus"]

[tool.hatch.build.targets.sdist]
# Hatchling's default sdist includes everything not gitignored. An explicit
# include keeps the tarball lean — dev-only files at the repo root
# (IMPLEMENTATION.md, ROADMAP.md, notes/, mkdocs.yml, uv.lock) are omitted.
include = [
    "pptx_plus/",
    "tests/",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "SPEC.md",
    "pyproject.toml",
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["pptx_plus"]
show_error_codes = true
warn_unused_ignores = true
warn_unused_configs = true

# NOTE: there is deliberately no `[[tool.mypy.overrides]] module = ["pptx.*"]`
# here. python-pptx 1.0.2 ships `py.typed` and inline annotations, so an
# `ignore_missing_imports` override would be inert — and `warn_unused_configs`
# (which `strict` does NOT imply) is on above so a future stale override says
# so out loud instead of silently suppressing real errors.

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "tests/fixtures/*.pptx",
    # Ruff formats fenced Python inside Markdown, which means a bare
    # `ruff format` silently rewrites prose files. That is wrong here twice
    # over: `notes/` is a historical record that must not be edited after the
    # fact, and the snippets in SPEC.md and docs/ are illustrative — elided
    # signatures and hand-wrapped call sites chosen for a narrow column, not
    # code anyone runs. Left enabled, `ruff format --check` in CI would go red
    # on a contributor's perfectly good example.
    "*.md",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D"]
ignore = [
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"pptx_plus/_testing/**" = ["D"]
"pptx_plus/examples/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_libreoffice: smoke tests that need `soffice` on PATH",
]
addopts = "-ra"
# TODO(phase-5): add
#     filterwarnings = ["error::pptx_plus.core.relmap.RelIdLiteralWarning"]
# when `core/relmap.py` lands. RelIdLiteralWarning is the tripwire for an
# unrecognized relationship-id attribute (SPEC §4.4). At runtime it stays a
# warning, because a shape genuinely named "rId7" must not crash a library
# call; in the test suite it must be a hard failure — that is how the next
# `dsp:dataModelExt/@relId` gets found instead of silently producing a
# dangling reference. A filter naming a not-yet-importable module makes
# pytest error at collection, so it cannot be added before the module exists.

[tool.coverage.run]
source = ["pptx_plus"]
omit = [
    "pptx_plus/_testing/*",
    "pptx_plus/examples/*",
]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@overload",
]

[tool.bumpversion]
current_version = "0.1.0"
parse = '(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)'
serialize = ["{major}.{minor}.{patch}"]
allow_dirty = false
commit = true
message = "chore(release): bump version {current_version} -> {new_version}"
tag = true
tag_name = "v{new_version}"
tag_message = "chore(release): v{new_version}"
sign_tags = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "pptx_plus/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

# uv.lock records this project's own version in its `pptx-plus` package
# entry. Bump it here so the release commit is self-consistent; otherwise the
# next `uv` invocation re-locks and leaves a stray uv.lock diff after every
# release. Anchored on the name line because other locked packages can
# legitimately sit at the same version number.
[[tool.bumpversion.files]]
filename = "uv.lock"
search = '''name = "pptx-plus"
version = "{current_version}"'''
replace = '''name = "pptx-plus"
version = "{new_version}"'''
